compiler:
  compiler_style: gcc
  compiler_exe: gcc
  linker_exe: ar

directories:
  project_dir: .
  exe_path_name: bin/libngv.a
  include_dirs: [include, ext]
  source_dirs: [src]
  temp_dir: obj

default:
  linker_args: rcs

debug:
  compiler_args: -ggdb3 -std=c23 -Wall -Wconversion -Wshadow -Wextra -Wuninitialized -Wimplicit-fallthrough=5 -Wmisleading-indentation -Wstrict-overflow=5 -Wstringop-overflow=4 -Wunknown-pragmas -Wsuggest-attribute=pure -Wsuggest-attribute=cold -Wsuggest-attribute=noreturn -Wsuggest-attribute=const -Wsuggest-attribute=format -Wsuggest-attribute=malloc -Wstrict-aliasing -Wbad-function-cast -Wcast-qual -Wcast-align -Wcast-function-type -Wwrite-strings -Wlogical-op -fstack-protector-strong -fstrict-aliasing -fsanitize=address -fsanitize=leak -fsanitize=undefined -DDEBUG

no-asan:
  compiler_args: -g3 -std=c23 -Wall -DDEBUG -Wextra -Wconversion

renderdoc:
  compiler_args: -g3 -std=c23 -Wall -DNDEBUG -DDO_RENDERDOC -Wextra -Wconversion

release:
  compiler_args: -Ofast -DNDEBUG -std=c23

analyze:
  compiler_args: -g3 -std=c23 -Wno-missing-field-initializers -DDEBUG -Wno-unknown-pragmas -Wall -Wconversion -Wshadow -Wextra -fanalyzer
